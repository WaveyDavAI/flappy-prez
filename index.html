<script>
(() => {
'use strict';
/* =====================================================================
   FLAPPY PREZ: SMOG OF THE UNION
   A political-cartoon Flappy Bird parody. Everything is procedural.
   Debug URL params:
     ?boss=1       jump straight to the boss sequence
     ?char=0..4    preselect character (or donald/barack/joe/bushsr/dubya)
     ?start=1      skip title screen, go straight to "get ready"
     ?god=1        invincible (no crashes)
     ?auto=1       autopilot (flies itself; combine with god for demo)
     ?goal=N       number of obstacles before the boss (default 30)
     ?ts=N         time scale (e.g. 3 = triple speed) for testing
     ?debug=1      show hitboxes + FPS
   ===================================================================== */

// ---------------------------------------------------------------- setup
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
const qOn = k => Q.has(k) && Q.get(k) !== '0' && Q.get(k) !== 'false';
const DBG = {
  boss: qOn('boss'), god: qOn('god'), auto: qOn('auto'), hit: qOn('debug'),
  start: qOn('start'), ts: Math.max(0.1, Math.min(10, parseFloat(Q.get('ts')) || 1))
};
const BOSS_SCORE = Math.max(1, Math.min(999, parseInt(Q.get('goal'), 10) || 30));

const H = 640, G = 84;             // logical height, ground height
let W = 360, S = 1, OX = 0, OY = 0, DPR = 1, LR = 1;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = Math.random;
const FONT = '"Arial Black","Arial Bold","Helvetica Neue",Helvetica,Arial,sans-serif';
const INK = '#241509';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------------------------------------------------------------- characters
const CHARS = [
  { id: 'donald', name: 'The Donald', flaps: 'Hair & Lips', lips: true, hair: '#f2c14e',
    quips: ['HUGE!', 'BIGLY!', 'Tremendous!', 'Wrong!', 'Sad!', 'Nobody flaps better!'] },
  { id: 'barack', name: 'Barack', flaps: 'Ears', lips: false, hair: '#2b221c',
    quips: ['Yes we can!', 'Let me be clear...', 'Hope!', 'Change!', 'Thanks, Obama.'] },
  { id: 'joe', name: 'Joe', flaps: 'Lips', lips: true, hair: '#f3f3ee',
    quips: ['Malarkey!', "C'mon, man!", 'Folks!', "Here's the deal!", 'No joke!'] },
  { id: 'bushsr', name: 'Bush Sr.', flaps: 'Ears & Lips', lips: true, hair: '#cfcfca',
    quips: ['Read my lips!', 'Not gonna do it!', 'Wouldn\'t be prudent!', '1000 points of light!'] },
  { id: 'dubya', name: 'Dubya', flaps: 'Ears', lips: false, hair: '#7d6c5a',
    quips: ['Mission accomplished!', 'Heckuva job!', 'Strategery!', 'Misunderestimated!'] }
];
let charIdx = (() => {
  const q = (Q.get('char') || '').toLowerCase();
  if (q !== '') {
    const n = parseInt(q, 10);
    if (!isNaN(n)) return clamp(n, 0, 4);
    const f = CHARS.findIndex(c => c.id === q || c.id.startsWith(q.replace(/[^a-z]/g, '')));
    if (f >= 0) return f;
  }
  return clamp(parseInt(store.get('prezFlappyChar', '0'), 10) || 0, 0, 4);
})();
let best = parseInt(store.get('prezFlappyBest', '0'), 10) || 0;

// ---------------------------------------------------------------- audio
const Sfx = (() => {
  let A = null, master = null, nb = null;
  let muted = store.get('prezFlappyMute', '0') === '1';
  function init() {
    if (A) { if (A.state === 'suspended') A.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      A = new AC();
      master = A.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(A.destination);
      nb = A.createBuffer(1, A.sampleRate * 2, A.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { A = null; }
  }
  const ok = () => A && !muted && A.state === 'running';
  function tone(f, dur, type, vol, f2, delay) {
    if (!ok()) return;
    const t = A.currentTime + (delay || 0);
    const o = A.createOscillator(), g = A.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, ftype, delay, f2, q, swell) {
    if (!ok()) return;
    const t = A.currentTime + (delay || 0);
    const s = A.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = A.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    f.Q.value = q || 1;
    const g = A.createGain();
    g.gain.setValueAtTime(0.0001, t);
    if (swell) { g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
    else { g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('prezFlappyMute', muted ? '1' : '0'); if (master) master.gain.value = muted ? 0 : 0.5; if (!muted) { init(); this.click(); } },
    flap(lips) {
      noise(0.09, 0.18, 1400, 'bandpass', 0, 500, 0.8);
      tone(lips ? 210 : 520, 0.1, lips ? 'square' : 'triangle', lips ? 0.07 : 0.16, lips ? 120 : 260);
      if (lips) tone(160, 0.06, 'square', 0.05, 240, 0.05);
    },
    score() { tone(880, 0.07, 'square', 0.09); tone(1320, 0.14, 'square', 0.09, null, 0.07); },
    crash() { noise(0.45, 0.5, 1200, 'lowpass', 0, 120); tone(160, 0.35, 'sawtooth', 0.25, 45); tone(700, 0.25, 'square', 0.06, 200, 0.05); },
    click() { tone(660, 0.05, 'square', 0.08); },
    chomp(v) { v = v || 1; noise(0.12, 0.55 * v, 1500, 'lowpass', 0, 200); tone(95, 0.14, 'square', 0.25 * v, 45); },
    bossArrive() { tone(55, 1.4, 'sawtooth', 0.22, 38); tone(82, 1.4, 'sawtooth', 0.12, 55); noise(1.2, 0.2, 200, 'lowpass', 0, 80); tone(440, 0.18, 'square', 0.07, null, 0.1); tone(415, 0.18, 'square', 0.07, null, 0.3); tone(392, 0.5, 'square', 0.07, 370, 0.5); },
    roar() { tone(90, 0.7, 'sawtooth', 0.2, 60); noise(0.7, 0.25, 500, 'bandpass', 0, 250, 2); },
    suck() { noise(2.6, 0.4, 250, 'bandpass', 0, 3200, 1.5, true); tone(120, 2.6, 'sawtooth', 0.05, 480); },
    burp() { tone(120, 0.55, 'sawtooth', 0.28, 70); tone(95, 0.55, 'square', 0.1, 60, 0.03); noise(0.4, 0.15, 400, 'lowpass'); },
    best() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.08, null, i * 0.09)); },
    end() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.14, null, i * 0.16)); }
  };
})();

// ---------------------------------------------------------------- drawing helpers
function E(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU); }
function fs(c, fill, lw, stroke) { c.fillStyle = fill; c.fill(); if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || INK; c.stroke(); } }
function st(c, col, lw) { c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
function uni(c, fill, lw, els) { // union of ellipses with a single outer ink line
  c.beginPath();
  for (const e of els) { c.moveTo(e[0] + e[2], e[1]); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, TAU); }
  c.lineWidth = lw * 2; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); c.fillStyle = fill; c.fill();
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function hg(c, x, w, cols) { const g = c.createLinearGradient(x, 0, x + w, 0); cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), col)); return g; }
function vg(c, y, h, cols) { const g = c.createLinearGradient(0, y, 0, y + h); cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), col)); return g; }
function line(c, pts, col, lw) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); st(c, col, lw); }
function curve(c, x0, y0, cx, cy, x1, y1, col, lw) { c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); st(c, col, lw); }

function text(c, s, x, y, size, fill, align, strokeW, strokeCol, baseline) {
  c.font = `900 ${size}px ${FONT}`; c.textAlign = align || 'center'; c.textBaseline = baseline || 'middle';
  c.lineJoin = 'round';
  if (strokeW) { c.lineWidth = strokeW; c.strokeStyle = strokeCol || INK; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function fitSize(c, s, size, maxW) { c.font = `900 ${size}px ${FONT}`; const w = c.measureText(s).width; return w > maxW ? Math.floor(size * maxW / w) : size; }

// ---------------------------------------------------------------- heads
// All heads are drawn front-facing in a ~80x80 design space centred on (0,0).
// A = { wing: -1 (up) .. 1 (down), mouth: 0..1, flapT, t, dead }
function ear(c, s, px, py, rx, ry, ang, skin, dark) {
  c.save(); c.translate(px, py); c.rotate(s * ang);
  E(c, s * rx * 0.72, 0, rx, ry); fs(c, skin, 2);
  E(c, s * rx * 0.8, 1, rx * 0.52, ry * 0.62); c.fillStyle = dark; c.fill();
  c.beginPath(); c.arc(s * rx * 0.72, 0, rx * 0.78, s > 0 ? -1.2 : Math.PI + 1.2, s > 0 ? 1.2 : Math.PI - 1.2, s < 0);
  st(c, 'rgba(60,30,15,.35)', 1.2);
  c.restore();
}
function whoosh(c, A, x, y, s) { // motion lines near a flapping feature
  if (A.flapT > 0.28) return;
  const a = 1 - A.flapT / 0.28;
  c.save(); c.globalAlpha = a * 0.8; c.strokeStyle = '#fff6d0'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(x, y, 10 + i * 5, s > 0 ? -0.6 : Math.PI - 0.6, s > 0 ? 0.6 : Math.PI + 0.6); c.stroke(); }
  c.restore();
}
function xEyes(c, pts, sz) {
  c.lineCap = 'round';
  for (const p of pts) { line(c, [p[0] - sz, p[1] - sz, p[0] + sz, p[1] + sz], INK, 2.4); line(c, [p[0] + sz, p[1] - sz, p[0] - sz, p[1] + sz], INK, 2.4); }
}
function lipFlapLines(c, A, y) {
  if (A.mouth < 0.15) return;
  c.save(); c.globalAlpha = A.mouth; c.strokeStyle = '#fff6d0'; c.lineWidth = 1.8; c.lineCap = 'round';
  for (const s of [-1, 1]) for (let i = 0; i < 2; i++) { c.beginPath(); c.moveTo(s * (20 + i * 4), y - 6 + i * 6); c.lineTo(s * (27 + i * 4), y - 8 + i * 7); c.stroke(); }
  c.restore();
}

function hDonald(c, A) {
  const skin = '#f39a48', pale = '#fde2b4', h1 = '#fff3a8', h2 = '#f5c64f', h3 = '#cf8d25';
  const w = A.wing, m = A.mouth;
  // flapping side hair "wings"
  for (const s of [-1, 1]) {
    c.save(); c.translate(s * 23, -13); c.rotate(s * w * 0.85);
    c.beginPath(); c.moveTo(0, -7);
    c.bezierCurveTo(s * 12, -21, s * 30, -20, s * 40, -9);
    c.bezierCurveTo(s * 31, -9, s * 27, -5, s * 35, 2);
    c.bezierCurveTo(s * 23, 5, s * 10, 7, 0, 8); c.closePath();
    fs(c, vg(c, -18, 26, [h1, h2, h3]), 2);
    curve(c, s * 4, -1, s * 18, -12, s * 34, -9, 'rgba(160,95,20,.7)', 1);
    curve(c, s * 5, 3, s * 18, -4, s * 30, 0, 'rgba(160,95,20,.5)', 1);
    c.restore();
  }
  whoosh(c, A, -44, -14, -1); whoosh(c, A, 44, -14, 1);
  E(c, -28, 4, 5, 8); fs(c, skin, 2); E(c, 28, 4, 5, 8); fs(c, skin, 2);
  // jowly face
  uni(c, skin, 2, [[0, 2, 28, 32], [-14, 20, 13, 12], [14, 20, 13, 12], [0, 25, 15, 11]]);
  E(c, -17, 12, 7, 4); c.fillStyle = 'rgba(220,70,30,.25)'; c.fill(); E(c, 17, 12, 7, 4); c.fill();
  // goggle tan
  E(c, -11, -3, 10.5, 7.5); c.fillStyle = pale; c.fill(); E(c, 11, -3, 10.5, 7.5); c.fill();
  if (A.dead) xEyes(c, [[-11, -3], [11, -3]], 4);
  else for (const s of [-1, 1]) {
    const x = s * 11;
    E(c, x, -3, 5, 2.8); fs(c, '#fff', 1.2);
    E(c, x + 0.8, -2.6, 2.1, 2.1); c.fillStyle = '#243a5c'; c.fill();
    curve(c, x - 6.5, -3.5, x, -8, x + 6.5, -3.5, INK, 2.2); // heavy squint lid
    curve(c, x - 5, 1.5, x, 3.5, x + 5, 1.5, 'rgba(120,50,10,.6)', 1);
  }
  line(c, [-18, -12, -5, -9.5], '#e0b04a', 2.6); line(c, [18, -12, 5, -9.5], '#e0b04a', 2.6);
  c.beginPath(); c.moveTo(-1, 1); c.quadraticCurveTo(-5.5, 10, -1.5, 11.5); c.quadraticCurveTo(3, 12.5, 4.5, 9); st(c, INK, 1.6);
  // pursed lips (pucker grows when flapping)
  const lx = 6.5 + m * 5, ly = 4.6 + m * 5.5;
  E(c, 0, 20, lx, ly); fs(c, '#dc6150', 1.8);
  E(c, 0, 20.5, 2.6 + m * 3.6, 1.5 + m * 4); c.fillStyle = '#5a1a14'; c.fill();
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + 0.3; line(c, [Math.cos(a) * lx * 0.55, 20 + Math.sin(a) * ly * 0.55, Math.cos(a) * lx * 0.95, 20 + Math.sin(a) * ly * 0.95], 'rgba(120,20,10,.45)', 0.8); }
  lipFlapLines(c, A, 20);
  curve(c, -9, 33, 0, 36, 9, 33, 'rgba(120,50,10,.5)', 1.2);
  // the swoop: big combed-over hair that lifts on each flap
  const lift = Math.max(0, -w);
  c.save(); c.translate(-28, 2); c.rotate(-lift * 0.16); c.scale(1, 1 + lift * 0.12); c.translate(28, -2);
  c.beginPath();
  c.moveTo(-31, 3);
  c.bezierCurveTo(-37, -24, -22, -45, 2, -45);
  c.bezierCurveTo(27, -45, 40, -35, 42, -21);
  c.bezierCurveTo(43, -12, 37, -5, 30, -8);
  c.bezierCurveTo(27, -17, 14, -21, 0, -18);
  c.bezierCurveTo(-13, -16, -22, -10, -25, 4);
  c.closePath();
  const hgd = c.createLinearGradient(-30, -45, 30, -5); hgd.addColorStop(0, h3); hgd.addColorStop(0.35, h2); hgd.addColorStop(0.6, h1); hgd.addColorStop(1, h2);
  fs(c, hgd, 2.2);
  c.lineCap = 'round';
  curve(c, -24, -8, -24, -36, 6, -40, 'rgba(170,100,20,.7)', 1.2);
  curve(c, -17, -14, -12, -34, 14, -36, 'rgba(170,100,20,.6)', 1.2);
  curve(c, -6, -20, 10, -32, 34, -26, 'rgba(170,100,20,.6)', 1.2);
  curve(c, -30, 0, -32, -30, -8, -41, 'rgba(255,255,255,.55)', 1.6);
  c.restore();
}

function hBarack(c, A) {
  const skin = '#a56d47', dark = '#7c4c2e', hair = '#221a15', gray = '#827a73';
  ear(c, -1, -26, 2, 15, 20, A.wing * 0.8, skin, dark);
  ear(c, 1, 26, 2, 15, 20, A.wing * 0.8, skin, dark);
  whoosh(c, A, -48, 2, -1); whoosh(c, A, 48, 2, 1);
  uni(c, skin, 2, [[0, 2, 27, 35], [0, 18, 22, 21]]);
  // short cropped hair, grey at temples
  c.save(); E(c, 0, 2, 27, 35); c.clip();
  c.beginPath(); c.moveTo(-34, -1); c.quadraticCurveTo(-26, -23, 0, -22); c.quadraticCurveTo(26, -23, 34, -1);
  c.lineTo(34, -50); c.lineTo(-34, -50); c.closePath(); c.fillStyle = hair; c.fill();
  c.fillStyle = gray; E(c, -26, -7, 6, 11); c.fill(); E(c, 26, -7, 6, 11); c.fill();
  c.fillStyle = 'rgba(160,150,140,.45)';
  const R = mulberry(7); for (let i = 0; i < 40; i++) { const x = (R() * 2 - 1) * 24, y = -32 + R() * 12; E(c, x, y, 0.8, 0.8); c.fill(); }
  c.restore();
  E(c, 0, 2, 27, 35); st(c, INK, 2);
  c.lineCap = 'round';
  curve(c, -18, -9, -11, -14, -4, -11, hair, 3); curve(c, 18, -9, 11, -14, 4, -11, hair, 3);
  if (A.dead) xEyes(c, [[-10, -3], [10, -3]], 3.6);
  else for (const s of [-1, 1]) {
    const x = s * 10;
    E(c, x, -3, 4.6, 3.4); fs(c, '#fff', 1.2);
    E(c, x + 0.6, -2.8, 2.2, 2.4); c.fillStyle = '#2a1a10'; c.fill();
    curve(c, x - 5, 1.5, x, 4, x + 5, 1.5, 'rgba(60,30,15,.6)', 1.1);
  }
  c.beginPath(); c.moveTo(-1, 0); c.quadraticCurveTo(-2, 8, -5.5, 10.5); c.quadraticCurveTo(0, 13.5, 5.5, 10.5); st(c, INK, 1.6);
  // BIG grin
  const grin = () => { c.beginPath(); c.moveTo(-17, 16); c.quadraticCurveTo(0, 21, 17, 16); c.quadraticCurveTo(13, 33, 0, 33); c.quadraticCurveTo(-13, 33, -17, 16); c.closePath(); };
  grin(); c.fillStyle = '#4a1612'; c.fill();
  c.save(); c.clip();
  c.fillStyle = '#fbf6ea'; c.fillRect(-20, 10, 40, 14.5);
  c.fillStyle = '#c85a60'; E(c, 0, 33, 10, 5); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 0.8;
  for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 4.5, 16); c.lineTo(i * 4.5, 24); c.stroke(); }
  c.restore();
  grin(); st(c, INK, 1.8);
  curve(c, -19, 9, -23, 16, -18, 24, 'rgba(60,30,15,.55)', 1.3); curve(c, 19, 9, 23, 16, 18, 24, 'rgba(60,30,15,.55)', 1.3);
}

function hJoe(c, A) {
  const skin = '#f1c6a0', hair = '#f7f7f3';
  const m = A.mouth;
  E(c, -27, 3, 6, 9); fs(c, skin, 2); E(c, 27, 3, 6, 9); fs(c, skin, 2);
  uni(c, skin, 2, [[0, 2, 27, 35], [0, 18, 23, 20]]);
  // thin white slicked-back hair
  c.save(); E(c, 0, 2, 27, 35); c.clip();
  c.beginPath(); c.moveTo(-32, 4); c.quadraticCurveTo(-30, -16, -13, -21); c.quadraticCurveTo(0, -25, 13, -21); c.quadraticCurveTo(30, -16, 32, 4);

    smogBlobs(c, 1400, H, 30, 120, H - 120, 80, 170, ['rgba(150,135,70,.16)', 'rgba(120,120,60,.14)', 'rgba(110,90,60,.16)'], 71);
  });
  // foreground smog
  layers.smogFront = makeLayer(1250, H, c => {
    smogBlobs(c, 1250, H, 24, H - 220, H - 30, 70, 160, ['rgba(120,100,60,.3)', 'rgba(90,75,45,.34)', 'rgba(130,120,60,.25)'], 91);
    smogBlobs(c, 1250, H, 8, 0, 90, 70, 140, ['rgba(60,45,25,.3)'], 92);
  });
  layers.vignette = makeLayer(W, H, c => {
    const g = c.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(15,8,2,.6)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  });
  layers.puff = makeLayer(64, 64, c => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(70,60,50,1)'); g.addColorStop(0.5, 'rgba(70,60,50,.5)'); g.addColorStop(1, 'rgba(70,60,50,0)'); c.fillStyle = g; c.fillRect(0, 0, 64, 64); });
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#231811'); skyGrad.addColorStop(0.3, '#4c3a21'); skyGrad.addColorStop(0.62, '#8a743a'); skyGrad.addColorStop(0.85, '#a18b50'); skyGrad.addColorStop(1, '#8f7c4a');
}
function tileLayer(L, par, y) {
  let off = -((scroll * par) % L.w); if (off > 0) off -= L.w;
  if (L.pat === undefined) { L.pat = ctx.createPattern(L.cv, 'repeat-x'); if (L.pat && !L.pat.setTransform) L.pat = null; }
  if (L.pat) { // seamless: one pattern fill instead of abutting tiles
    L.pat.setTransform(new DOMMatrix([L.w / L.cv.width, 0, 0, L.h / L.cv.height, off, y]));
    ctx.fillStyle = L.pat; ctx.fillRect(0, y, W, L.h);
  } else {
    const extra = 1 / (S * DPR);
    for (let x = off; x < W; x += L.w) ctx.drawImage(L.cv, x, y, L.w + extra, L.h);

}

// ---------------------------------------------------------------- game state
let state = 'title';     // title | ready | play | dying | over | boss | levelEnd
let stateT = 0, T = 0, scroll = 0, worldSpeed = 60;
let score = 0, spawned = 0, obstacles = [], distSince = 0, lastGapC = null;
let particles = [], ash = [], shake = 0, flash = 0, paused = false, newBest = false;
let quipText = '', flapCount = 0;
const player = { x: 100, y: 300, vy: 0, rot: 0, flapT: 1, r: 24, hit: 17, scale: 1, spin: 0, visible: true, dead: false };
let boss = null;
const bossL = { x: 0, y: 0, R: 100, px: 80 };
let buttons = [];
let fps = 60, fpsAcc = 0, fpsN = 0;

const GRAV = 1500, FLAP_V = -430, MAX_FALL = 640;
function diff() { const t = clamp(score / BOSS_SCORE, 0, 1); return { speed: 165 + 75 * t, gap: 184 - 38 * t, shift: 120 + 70 * t, spacing: 265 - 20 * t }; }
function playerX() { return Math.round(Math.min(W * 0.28, 330)); }

function resetRun() {
  score = 0; spawned = 0; obstacles = []; distSince = 0; lastGapC = null; particles = particles.filter(p => p.type === 'smoke' && p.bg);
  player.x = playerX(); player.y = H * 0.42; player.vy = 0; player.rot = 0; player.flapT = 1; player.scale = 1; player.spin = 0; player.visible = true; player.dead = false;
  boss = null; newBest = false; flapCount = 0; quipText = '';
}
function setState(s) { state = s; stateT = 0; }
function toTitle() { resetRun(); setState('title'); }
function toReady() { resetRun(); setState('ready'); store.set('prezFlappyChar', String(charIdx)); }
function startPlay() { setState('play'); flap(); }

function flap() {
  const ch = CHARS[charIdx];
  if (state === 'boss') {
    if (boss && (boss.phase === 'chomp' || boss.phase === 'chew' || boss.phase === 'burp')) return;
    player.vy = Math.min(player.vy, FLAP_V * (boss && boss.phase === 'suck' ? 0.55 : 1));
    if (boss && boss.phase === 'suck') for (let i = 0; i < 2; i++) particles.push({ type: 'sweat', x: player.x + (rnd() - 0.5) * 30, y: player.y - 18, vx: (rnd() - 0.5) * 120, vy: -120 - rnd() * 80, life: 0, max: 0.6 });
  } else player.vy = FLAP_V;
  player.flapT = 0; flapCount++;
  Sfx.flap(ch.lips);
  if (flapCount % 6 === 3 && state !== 'ready') {
    particles.push({ type: 'quip', x: player.x + 10, y: player.y - 34, vx: -20, vy: -40, life: 0, max: 1.1, text: ch.quips[(rnd() * ch.quips.length) | 0] });
  }
  for (let i = 0; i < 3; i++) particles.push({ type: 'puff', x: player.x - 10, y: player.y + 10, vx: -60 - rnd() * 60, vy: 40 + rnd() * 60, life: 0, max: 0.4, r: 3 + rnd() * 3 });
}

function spawnObstacle(atX) {
  const D = diff();
  const gap = D.gap, minC = gap / 2 + 60, maxC = H - G - gap / 2 - 45;
  const c = lastGapC === null ? (minC + maxC) / 2 + (rnd() - 0.5) * 60 : clamp(lastGapC + (rnd() * 2 - 1) * D.shift, minC, maxC);
  lastGapC = c;
  const topTypes = ['pipe', 'tower', 'stack'], botTypes = ['pipe', 'stack', 'tower', 'flare'];
  const x = atX != null ? atX : spawned === 0 ? Math.min(W + 20, player.x + 560) : W + 20;
  obstacles.push({ x, w: 80, intro: x < W ? 0 : 1, gc: c, gap, top: topTypes[(rnd() * 3) | 0], bot: botTypes[(rnd() * 4) | 0], seed: (rnd() * 1e9) | 0, passed: false, n: spawned + 1 });
  makeObsSprites(obstacles[obstacles.length - 1]);
  spawned++;
}
// Pre-render each obstacle half once (drawing hundreds of rivets/bricks every frame is wasteful).
const OBS_M = 40;
function makeObsSprites(o) {
  const gt = o.gc - o.gap / 2, gb = o.gc + o.gap / 2;
  o.Lb = Math.max(30, H - G - gb + 20); o.Lt = Math.max(30, gt + 20);
  const mk = (type, L, seed) => makeLayer(o.w + OBS_M * 2, L + OBS_M * 2, c => { c.translate(OBS_M, OBS_M); OBS[type](c, o.w, L, mulberry(seed), 0, o.seed % 100); });
  o.sprB = mk(o.bot, o.Lb, o.seed); o.sprT = mk(o.top, o.Lt, o.seed + 1);
}

function circleRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function obsRects(o) {
  const gt = o.gc - o.gap / 2, gb = o.gc + o.gap / 2;
  return [{ x: o.x + 4, y: -1000, w: o.w - 8, h: gt + 1000 }, { x: o.x + 4, y: gb, w: o.w - 8, h: 1000 }];
}

function crash() {
  if (DBG.god) return;
  setState('dying'); player.dead = true;
  player.vy = -260; shake = 14; flash = 1; Sfx.crash();
  for (let i = 0; i < 14; i++) { const a = rnd() * TAU; particles.push({ type: 'star', x: player.x, y: player.y, vx: Math.cos(a) * (100 + rnd() * 160), vy: Math.sin(a) * (100 + rnd() * 160), life: 0, max: 0.7, r: 2 + rnd() * 3 }); }
}
function gameOver() {
  setState('over');
  if (score > best) { best = score; newBest = true; store.set('prezFlappyBest', String(best)); setTimeout(() => Sfx.best(), 250); }
  else Sfx.end();
  quipText = ['Your approval rating crashed.', 'Grounded by the refinery lobby.', 'Recount requested... denied.', 'Term limits reached.', 'The smog won this round.', 'Pipeline 1, You 0.', 'Lost in committee.'][(rnd() * 7) | 0];
}

function layoutBoss() {
  const R = Math.min(H * 0.25, W * 0.36);
  const px = Math.min(W * 0.17, 260);
  bossL.R = R; bossL.px = px;
  bossL.x = clamp(W * 0.72, px + 70 + R * 0.85, W - R * 0.55);
  bossL.y = H - G - 16 - 122 * R / 100;   // chin rests just below the horizon, suit in front of the ground
}
function bossMouth() {
  const k = bossL.R / 100, d = boss.open * 95 + boss.chew * 26;
  return { x: boss.x, y: bossL.y + (48 + d / 2) * k };
}
function startBoss() {
  layoutBoss();
  setState('boss');
  boss = { phase: 'enter', t: 0, x: W + bossL.R * 1.3, open: 0, chew: 0, say: ['Mmm... presidential!', 'Time for a working lunch!', 'Is that a snack I see?'][(rnd() * 3) | 0] };
  Sfx.bossArrive(); shake = 6;
}
function setBossPhase(p) { boss.phase = p; boss.t = 0; }

// ---------------------------------------------------------------- update
function update(dt) {
  T += dt; stateT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);
  player.flapT += dt;

  let target = 0;
  if (state === 'title') target = 70;
  else if (state === 'ready') target = 110;
  else if (state === 'play') target = diff().speed;
  else if (state === 'boss') target = boss && boss.phase === 'enter' ? lerp(diff().speed, 0, clamp(boss.t / 1.6, 0, 1)) : 0;
  worldSpeed = (state === 'dying' || state === 'over') ? 0 : lerp(worldSpeed, target, Math.min(1, dt * 3));
  scroll += worldSpeed * dt;

  updateAmbient(dt);

  if (state === 'title' || state === 'ready') {
    player.x = lerp(player.x, playerX(), Math.min(1, dt * 4));
    player.y = H * 0.42 + Math.sin(T * 3) * 10; player.vy = 0; player.rot = Math.sin(T * 2) * 0.08;
    if (player.flapT > 0.5 && ((T * 2.5) % 1) < dt * 2.5) player.flapT = 0; // idle flapping
  } else if (state === 'play') {
    updatePlayerPhysics(dt);
    if (DBG.auto) autopilot();
    const D = diff();
    if (spawned < BOSS_SCORE) {
      const lastO = obstacles[obstacles.length - 1];
      if (spawned === 0 ? stateT > 0.6 : (!lastO || lastO.x + D.spacing <= W + 20)) spawnObstacle(lastO && spawned > 0 ? lastO.x + D.spacing : null);
    }
    for (const o of obstacles) {
      o.x -= worldSpeed * dt; if (o.intro < 1) o.intro = Math.min(1, o.intro + dt * 2.2);
      if (!o.passed && o.x + o.w / 2 < player.x) { o.passed = true; score++; Sfx.score(); particles.push({ type: 'plus', x: player.x, y: player.y - 30, vx: 0, vy: -60, life: 0, max: 0.6 }); }
      if (o.bot === 'stack' && rnd() < dt * 3) particles.push({ type: 'smoke', x: o.x + o.w / 2, y: o.gc + o.gap / 2 - 4, vx: -20, vy: -30, life: 0, max: 1.2, r: 5, g: 22, par: 1, a: 0.35 });
    }
    obstacles = obstacles.filter(o => o.x + o.w > -40);
    if (!DBG.god) {
      for (const o of obstacles) for (const r of obsRects(o)) if (circleRect(player.x, player.y, player.hit, r.x, r.y, r.w, r.h)) { crash(); return; }
    }
    if (player.y + player.hit > H - G) {
      player.y = H - G - player.hit;
      if (DBG.god) player.vy = FLAP_V; else { crash(); return; }
    }
    if (spawned >= BOSS_SCORE && obstacles.length === 0) startBoss();
  } else if (state === 'dying') {
    player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL * 1.3); player.y += player.vy * dt; player.rot += dt * 8;
    if (player.y + player.hit > H - G) { player.y = H - G - player.hit; player.vy = 0; if (stateT > 0.35) gameOver(); }
  } else if (state === 'boss') {
    updateBoss(dt);
  }
  for (const p of particles) {
    p.life += dt;
    if (p.type === 'suck' && boss) {
      const m = bossMouth(); const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy) || 1;
      const acc = 900 + 1400 * clamp(boss.t / 2, 0, 1);
      p.vx += dx / d * acc * dt; p.vy += dy / d * acc * dt; p.vx *= 0.985; p.vy *= 0.985;
      if (d < 26) p.life = p.max;
    } else if (p.type === 'smoke') { p.r += p.g * dt; p.x -= worldSpeed * (p.par || 0) * dt; }
    else if (p.type === 'star' || p.type === 'sweat' || p.type === 'tuft') { p.vy += (p.type === 'tuft' ? 60 : 500) * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life < p.max);
}

function updatePlayerPhysics(dt) {
  player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
  player.y += player.vy * dt;
  if (player.y < -40) { player.y = -40; player.vy = Math.max(0, player.vy); }
  player.rot = lerp(player.rot, clamp(player.vy / 900, -0.35, 0.6), Math.min(1, dt * 10));
}
function autopilot() {
  const next = obstacles.find(o => o.x + o.w + player.hit > player.x);
  const tgt = next ? next.gc + next.gap * 0.12 : H * 0.45;
  if (player.y > tgt && player.vy > -40) flap();
}

function updateBoss(dt) {
  const B = boss; B.t += dt;
  const k = bossL.R / 100;
  if (B.phase !== 'suck') player.x = lerp(player.x, bossL.px, Math.min(1, dt * 1.2));
  if (B.phase === 'enter' || B.phase === 'open') {
    updatePlayerPhysics(dt);
    // can't escape by crashing either: the floor bounces you back up
    if (player.y + player.hit > H - G - 10) { player.y = H - G - 10 - player.hit; player.vy = FLAP_V * 0.8; }
    if (DBG.auto && player.y > H * 0.5 && player.vy > 0) flap();
  }
  if (B.phase === 'enter') {
    B.x = lerp(W + bossL.R * 1.3, bossL.x, easeOutBack(clamp(B.t / 1.7, 0, 1)));
    if (B.t > 3.5) { setBossPhase('open'); Sfx.roar(); shake = 8; }
  } else if (B.phase === 'open') {
    B.open = easeOut(clamp(B.t / 0.6, 0, 1));
    if (B.t > 0.7) { setBossPhase('suck'); Sfx.suck(); }
  } else if (B.phase === 'suck') {
    B.open = 1 + Math.sin(T * 30) * 0.03;
    shake = Math.max(shake, 2.5);
    const m = bossMouth();
    const dx = m.x - player.x, dy = m.y - player.y, dist = Math.hypot(dx, dy) || 1;
    const acc = 350 + 900 * B.t;
    player.vy += (dy / dist * acc - player.vy * 1.6) * dt;   // damped pull: flaps only buy a moment
    player.vy = clamp(player.vy, -600, 700);
    const vx = dx / dist * Math.min(70 + 330 * B.t * B.t, 900);
    player.x += vx * dt; player.y += player.vy * dt;
    if (B.t > 2.0) { const f = Math.min(1, (B.t - 2.0) * 6 * dt); player.x = lerp(player.x, m.x, f); player.y = lerp(player.y, m.y, f); }
    player.spin += dt * (3 + B.t * 7); player.rot = player.spin;
    player.scale = clamp(dist / 110, 0.3, 1.15);
    if (DBG.auto && rnd() < dt * 5) flap();
    for (let i = 0; i < 3; i++) if (rnd() < dt * 40) {
      const x = rnd() * Math.max(40, m.x - 60), y = rnd() * (H - G);
      particles.push({ type: 'suck', x, y, vx: 0, vy: 0, life: 0, max: 2.5, col: rnd() < 0.5 ? 'rgba(220,200,150,.85)' : 'rgba(120,105,80,.85)' });
    }
    if ((dist < 22 * Math.max(1, k) && B.t > 1.6) || B.t > 3.4) { player.visible = false; setBossPhase('chomp'); particles = particles.filter(p => p.type !== 'suck'); }
  } else if (B.phase === 'chomp') {
    B.open = 1 - easeOut(clamp(B.t / 0.18, 0, 1));
    if (B.t > 0.18 && !B.chomped) {
      B.chomped = true; Sfx.chomp(1.2); shake = 16; flash = 0.35;
      const m = bossMouth();
      for (let i = 0; i < 10; i++) particles.push({ type: 'star', x: m.x, y: m.y, vx: (rnd() - 0.8) * 300, vy: (rnd() - 0.7) * 300, life: 0, max: 0.6, r: 2 + rnd() * 3 });
    }
    if (B.t > 0.45) setBossPhase('chew');
  } else if (B.phase === 'chew') {
    B.open = 0; B.chew = (Math.sin(B.t * 13) * 0.5 + 0.5) * 0.35 * (1 - clamp((B.t - 1.6) / 0.3, 0, 1));
    if (Math.floor(B.t * 13 / TAU) !== Math.floor((B.t - dt) * 13 / TAU)) Sfx.chomp(0.45);
    if (B.t > 1.9) { setBossPhase('burp'); Sfx.burp(); B.say = 'Pardon me.'; }
  } else if (B.phase === 'burp') {
    B.chew = 0; B.open = B.t < 0.6 ? Math.sin(B.t / 0.6 * Math.PI) * 0.3 : 0;
    if (!B.burped && B.t > 0.1) {
      B.burped = true; const m = bossMouth();
      for (let i = 0; i < 12; i++) particles.push({ type: 'smoke', x: m.x - 20, y: m.y, vx: -80 - rnd() * 120, vy: (rnd() - 0.5) * 80, life: 0, max: 1.4, r: 8 + rnd() * 8, g: 30, par: 0, a: 0.5 });
      particles.push({ type: 'tuft', x: m.x - 40, y: m.y - 10, vx: -90, vy: -120, life: 0, max: 2.4, col: CHARS[charIdx].hair, ci: charIdx });
    }
    if (B.t > 1.9) {
      if (score > best) { best = score; newBest = true; store.set('prezFlappyBest', String(best)); }
      setState('levelEnd'); Sfx.best();
    }
  }
}

function updateAmbient(dt) {
  while (ash.length < 70) ash.push({ x: rnd() * W, y: rnd() * H, s: 0.6 + rnd() * 1.8, v: 10 + rnd() * 30, ph: rnd() * TAU });
  for (const a of ash) {
    a.x -= (a.v + worldSpeed * 0.3 * a.s) * dt; a.y += (8 + a.s * 6) * dt + Math.sin(T * 2 + a.ph) * 0.3;
    if (a.x < -5) { a.x = W + 5; a.y = rnd() * H; } if (a.y > H) a.y = -5;
  }
  // smoke plumes from background stacks
  const Lm = layers.refMid; if (!Lm) return;
  const baseY = H - G + 14 - Lm.h;
  let off = -((scroll * 0.3) % Lm.w); if (off > 0) off -= Lm.w;
  for (let x0 = off; x0 < W + 40; x0 += Lm.w) for (const s of layers.meta.mid.stacks) {
    const x = x0 + s.x; if (x < -40 || x > W + 40) continue;
    if (rnd() < dt * 5) particles.push({ type: 'smoke', x, y: baseY + s.y, vx: -15 - rnd() * 10, vy: -18 - rnd() * 14, life: 0, max: 3.5 + rnd() * 2, r: 5, g: 11, par: 0.3, a: 0.45, bg: true });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

// ---------------------------------------------------------------- render
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120c07'; ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0; if (shake > 0) { sx = (rnd() - 0.5) * shake; sy = (rnd() - 0.5) * shake; }
  ctx.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  // sky & smog-dimmed sun
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);
  const sunX = W * 0.72, sunY = H * 0.26;
  const g = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 200); g.addColorStop(0, 'rgba(255,225,150,.5)'); g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.fillRect(sunX - 200, sunY - 200, 400, 400);
  E(ctx, sunX, sunY, 34, 34); ctx.fillStyle = 'rgba(250,225,165,.75)'; ctx.fill();
  tileLayer(layers.smogFar, 0.05, 40);
  const farY = H - G + 20 - layers.refFar.h;
  const farOff = tileLayer(layers.refFar, 0.12, farY);
  drawBgFlares(layers.meta.far.flares, farOff, layers.refFar.w, farY, 0.7);
  tileLayer(layers.smogMid, 0.2, 230);
  const midY = H - G + 14 - layers.refMid.h;
  const midOff = tileLayer(layers.refMid, 0.3, midY);
  drawBgFlares(layers.meta.mid.flares, midOff, layers.refMid.w, midY, 1);
  for (const p of particles) if (p.type === 'smoke' && p.bg) drawParticle(p);
  tileLayer(layers.trees, 0.55, H - G + 16 - layers.trees.h);

  for (const o of obstacles) drawObstacle(o);
  for (const p of particles) if (p.type === 'smoke' && !p.bg) drawParticle(p);
  tileLayer(layers.smogNear, 0.8, 0);
  tileLayer(layers.ground, 1, H - G - 14);

  if (boss) {
    const lx = (player.x - boss.x) / 200, ly = (player.y - bossL.y) / 200;
    const wob = boss.phase === 'suck' ? Math.sin(T * 40) * 2 : 0;
    drawBoss(ctx, boss.x + wob, bossL.y + (boss.phase === 'enter' ? Math.sin(T * 2) * 4 : 0), bossL.R, boss, T, lx, ly);
  }
  for (const p of particles) if (p.type === 'suck') drawParticle(p);

  if (state !== 'title' && player.visible) {
    const sucking = state === 'boss' && boss && boss.phase === 'suck';
    const A = { wing: wingOf(player.flapT, T, sucking ? 30 : 7), mouth: mouthOf(player.flapT), flapT: player.flapT, t: T, dead: player.dead };
    if (sucking) { A.mouth = 0.6 + Math.sin(T * 20) * 0.4; A.flapT = 0.1; A.wing = Math.sin(T * 30); }
    const stretch = sucking ? 1 + (1 - player.scale) * 0.6 : 1;
    drawHead(ctx, charIdx, player.x, player.y, player.r * player.scale, A, player.rot, stretch, 1 / stretch);
    if (DBG.hit) { E(ctx, player.x, player.y, player.hit, player.hit); st(ctx, '#0f0', 1.5); }
  }
  for (const p of particles) if (p.type !== 'smoke' && p.type !== 'suck') drawParticle(p);

// ---------------------------------------------------------------- input
function toLogical(e) { return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S }; }
function hitButton(pt) {
  for (const b of buttons) if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) { b.action(); return true; }
  return false;
}
function press(pt) {
  Sfx.init();
  if (paused) { paused = false; return; }
  if (pt && hitButton(pt)) return;
  primary(!!pt);
}
function primary(fromPointer) {
  if (state === 'title') { if (!fromPointer) { Sfx.click(); toReady(); } }
  else if (state === 'ready') startPlay();
  else if (state === 'play' || state === 'boss') flap();
  else if ((state === 'over' || state === 'levelEnd') && stateT > 0.6 && !fromPointer) toReady();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); press(toLogical(e)); }, { passive: false });
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  Sfx.init();
  if (paused) { paused = false; return; }
  if (k === 'm' || k === 'M') { Sfx.toggle(); return; }
  if ((k === 'p' || k === 'P') && (state === 'play' || state === 'boss')) { paused = true; return; }
  if (state === 'title') {
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { charIdx = (charIdx + 4) % 5; Sfx.click(); return; }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { charIdx = (charIdx + 1) % 5; Sfx.click(); return; }
    if (k >= '1' && k <= '5') { charIdx = +k - 1; Sfx.click(); return; }
  }
  if ((state === 'over' || state === 'levelEnd') && (k === 'c' || k === 'C' || k === 'Escape') && stateT > 0.6) { Sfx.click(); toTitle(); return; }
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter') primary(false);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'play' || state === 'boss')) paused = true; });
window.addEventListener('resize', resize);

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(clamp(ww / wh * H, 290, 1400));
  S = Math.min(ww / W, wh / H);
  OX = (ww - W * S) / 2; OY = (wh - H * S) / 2;
  cv.width = Math.round(ww * DPR); cv.height = Math.round(wh * DPR);
  cv.style.width = ww + 'px'; cv.style.height = wh + 'px';
  buildLayers(); layoutBoss();
  for (const o of obstacles) makeObsSprites(o);
  if (state === 'title' || state === 'ready') player.x = playerX();
  ash = [];
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt > 0) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; } }
  dt *= DBG.ts;
  if (!paused && dt > 0) { const n = Math.max(1, Math.ceil(dt / (1 / 120))); const h = dt / n; for (let i = 0; i < n; i++) update(h); }
  render();
  requestAnimationFrame(frame);
}

resize();
resetRun();
if (DBG.boss) { score = BOSS_SCORE; spawned = BOSS_SCORE; setState('play'); worldSpeed = diff().speed; player.vy = FLAP_V; }
else if (DBG.start) toReady();

// test / debug hook
window.__game = {
  get state() { return state; }, get score() { return score; }, get best() { return best; },
  get player() { return { x: player.x, y: player.y, vy: player.vy, visible: player.visible }; },
  get boss() { return boss ? { phase: boss.phase, t: boss.t, x: boss.x, open: boss.open } : null; },
  get obstacles() { return obstacles.map(o => ({ x: o.x, gc: o.gc, gap: o.gap, top: o.top, bot: o.bot })); },
  get charIdx() { return charIdx; }, get W() { return W; }, get fps() { return fps; }, get muted() { return Sfx.muted; },
  get buttons() { return buttons.map(b => ({ x: OX + (b.x + b.w / 2) * S, y: OY + (b.y + b.h / 2) * S, w: b.w * S, h: b.h * S })); },
  bench(n) { // debug: average ms per render() and per layer group
    const t0 = performance.now(); for (let i = 0; i < n; i++) render(); const r = (performance.now() - t0) / n;
    return { render: r, T };
  },
  flap() { press(null); }, setChar(i) { charIdx = clamp(i | 0, 0, 4); }, toReady, toTitle
};
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
